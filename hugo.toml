# =============================================================
# 中医之道 · The Way of Chinese Medicine
# A plain-English introduction to Traditional Chinese Medicine (TCM).
# This branch (master) is a standalone TCM introduction site —
# separate from the ChinaCare medical portal on the `medical` branch.
# =============================================================

baseURL = 'https://pastor17.github.io/cmedical/'
title = '中医之道 · The Way of Chinese Medicine'
languageCode = 'en-US'
defaultContentLanguage = 'en'
hasCJKLanguage = true
summaryLength = 140
enableEmoji = true
enableRobotsTXT = true
disableKinds = ['RSS']
disableHugoGeneratorInject = true

[params]
  subtitle = 'An introduction to Traditional Chinese Medicine'
  description = 'A plain-English introduction to Traditional Chinese Medicine (TCM) — what it is, its history, its main practices (acupuncture, herbal medicine, tuina, cupping), and how it is used today alongside modern medicine.'
  author = '中医之道 Editorial'
  siteName = '中医之道'
  copyright = '© 2026 中医之道 · The Way of Chinese Medicine'
  defaultCoverEmoji = '🌿'
  contactEmail = 'irudder@126.com'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[permalinks]
  practices = '/practice/:slug/'
  topics = '/topic/:slug/'

[pagination]
  pagerSize = 12
  path = 'page'
