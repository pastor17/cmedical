# =============================================================
# ChinaCare · China Medical Portal — Hugo site config
# One-stop platform for international patients seeking care in China:
# hospital selection, appointment, teleconsultation, payment, follow-up.
# =============================================================

# GitHub Pages project page: https://<user>.github.io/cmedical/
baseURL = 'https://pastor17.github.io/cmedical/'
title = 'ChinaCare'
languageCode = 'en-US'
defaultContentLanguage = 'en'
summaryLength = 140
enableEmoji = true
enableRobotsTXT = true
disableKinds = ['RSS']
disableHugoGeneratorInject = true

[params]
  subtitle = 'Your guide to healthcare in China'
  description = 'ChinaCare helps international patients access China’s hospitals — choose the right hospital, book an appointment, consult online, understand costs and payment, and plan follow-up care. A one-stop, English-first guide to getting care in China.'
  author = 'ChinaCare Editorial'
  siteName = 'ChinaCare'
  copyright = '© 2026 ChinaCare · Your guide to healthcare in China'
  defaultCoverEmoji = '🏥'
  contactEmail = 'irudder@126.com'

# -------------------------------------------------------------
# Taxonomies
#   specialty → medical specialty (oncology, dental, ivf, ...)
#   stage     → care journey stage (choose/register/consult/pay/visit/recover/prepare)
#   city      → city (beijing, shanghai, ...)
# -------------------------------------------------------------
[taxonomies]
  specialty = 'specialties'
  stage = 'stages'
  city = 'cities'
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[permalinks]
  hospitals = '/hospital/:slug/'
  doctors = '/doctor/:slug/'
  guides = '/guide/:slug/'
  cost = '/cost/:slug/'
  stories = '/story/:slug/'
  journey = '/journey/:slug/'
  tcm = '/tcm/:slug/'

# Pagination: 12 items per page
[pagination]
  pagerSize = 12
  path = 'page'
