{{ define "main" }}
<div class="container page-head">
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</div>
<div class="container">
  <div class="card-grid">
    {{- range .Pages -}}
      {{- if eq .Section "hospitals" -}}
        {{ partial "hospital-card.html" . }}
      {{- else -}}
        {{ partial "story-card.html" . }}
      {{- end -}}
    {{- end -}}
  </div>
</div>
{{ end }}
