{{ define "main" }}
<div class="container page-head">
  <h1 class="page-title">Specialties</h1>
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</div>
<div class="container">
  <div class="spec-grid">
    {{- range site.Data.specialties -}}
      {{- $page := site.GetPage (printf "/specialties/%s" .slug) -}}
      <a class="spec-card" href="{{ if $page }}{{ $page.RelPermalink }}{{ else }}{{ "specialties/" | relURL }}{{ end }}" style="--card-color: {{ .color }}">
        <span class="spec-card__emoji" aria-hidden="true">{{ .emoji }}</span>
        <h2 class="spec-card__name">{{ .name }}</h2>
        <p class="spec-card__desc">{{ .description }}</p>
      </a>
    {{- end -}}
  </div>
</div>
{{ end }}
