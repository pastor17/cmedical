{{ define "main" }}
<div class="container page-head">
  <h1 class="page-title">{{ .Title }}</h1>
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</div>
<div class="container">
  <div class="card-grid">
    {{- range .Pages -}}
      <a class="card" href="{{ .RelPermalink }}">
        <div class="card__body" style="padding:22px">
          <h3 class="card__title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
          <p class="card__meta" style="border:0;padding:0">{{ len .Pages }} page{{ if ne (len .Pages) 1 }}s{{ end }}</p>
        </div>
      </a>
    {{- end -}}
  </div>
</div>
{{ end }}
